import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.azuredoom.hytale-tools'
    id 'com.gradleup.shadow' version '9.6.1'
}

def localProperties = new Properties()
file('gradle.properties').withInputStream { localProperties.load(it) }
def property = { String name ->
    providers.gradleProperty(name).getOrElse(localProperties.getProperty(name))
}

group = 'com.alechilles'
version = property('mod_version')
def tameworkProject = findProject(':alecstamework')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://www.cursemaven.com') }
}

dependencies {
    if (tameworkProject == null) {
        compileOnly files(property('tamework_jar_path'))
    } else {
        compileOnly files(tameworkProject.sourceSets.main.output)
    }
    implementation "curse.maven:creditor-1560961:${property('creditor_file_id')}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

if (tameworkProject != null) {
    tasks.named('compileJava') {
        dependsOn(tameworkProject.tasks.named('classes'))
    }
}

hytaleTools {
    hytaleVersion = property('hytale_version')
    patchline = property('hytale_patchline')
    manifestServerVersion = '0.5.x'
    manifestFile = layout.projectDirectory.file('src/main/resources/manifest.json')
    manifestGroup = 'Alechilles'
    modId = 'HyDragon'
    modDescription = 'HyDragon'
    modUrl = 'https://modstats.io/stats'
    modCredits = 'Alec (Alechilles)||https://www.curseforge.com/members/alechilles/projects,Ye||https://www.curseforge.com/members/onlyye/projects'
    mainClass = 'com.alechilles.hydragon.HyDragonPlugin'
    manifestDependencies = "Alechilles:Alec's Tamework!=>=3.0.2 <4.0.0"
    manifestOptionalDependencies = "Alechilles:Alec's Nametags!=*,Alechilles:Alec's Telemetry!=>=1.0.0 <2.0.0"
    curseforgeId = '1503366'
    includesPack = true
    bundleAssetEditorRuntime = false
    assetPackSourceDirectory = layout.projectDirectory.dir('src/main/resources')
}

tasks.named('processResources', Copy) {
    exclude 'Common/**/Source/**', 'Common/**/*.bbmodel', '**/*.bak'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar', ShadowJar) {
    archiveFileName = "HyDragon v${project.version}.jar"
    archiveClassifier = ''
    manifest {
        attributes(
                'Plugin-Group': project.group,
                'Plugin-Name': project.name,
                'Plugin-Version': project.version)
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

tasks.register('prepareWorkspaceAssets') {
    description = 'Verifies HyDragon uses the conventional Gradle resource layout for workspace staging.'
    group = 'hytale'
    inputs.dir(layout.projectDirectory.dir('src/main/resources/Common'))
    inputs.dir(layout.projectDirectory.dir('src/main/resources/Server'))
}

tasks.named('prepareRunServer') {
    dependsOn(tasks.named('prepareWorkspaceAssets'))
}

tasks.register('validateHyDragonAssets', Exec) {
    commandLine 'python', 'scripts/validate_assets.py'
}

tasks.named('check') {
    dependsOn(tasks.named('validateHyDragonAssets'))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
    systemProperty 'hydragon.project.basedir', projectDir.absolutePath
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}

tasks.named('test') {
    exclude '**/*IT.class'
}

tasks.register('packagingTest', Test) {
    description = 'Runs packaged HyDragon integration tests against current Gradle artifacts.'
    group = 'verification'
    dependsOn(tasks.named('shadowJar'))
    if (tameworkProject != null) {
        dependsOn(tameworkProject.tasks.named('shadowJar'))
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    useJUnitPlatform()
    systemProperty 'hydragon.project.basedir', projectDir.absolutePath
    systemProperty 'hydragon.packaged.jar', tasks.named('shadowJar', ShadowJar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'hydragon.tamework.jar', {
        tameworkProject == null
                ? file(property('tamework_jar_path')).absolutePath
                : tameworkProject.tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    }.call()
    systemProperty 'hydragon.plugin.version', project.version.toString()
    systemProperty 'hydragon.tamework.version', property('tamework_version')
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
